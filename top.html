<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top</title>

<style>

body{
    margin:0;
    height:100vh;
    font-family:Arial,sans-serif;
    overflow:hidden;

    background:linear-gradient(
    135deg,
    #dbeafe,
    #bfdbfe,
    #93c5fd
    );
}

/* Decorative Shapes */

.circle1{
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(255,255,255,0.35);
    border-radius:50%;
    top:-120px;
    left:-100px;
}

.circle2{
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(255,255,255,0.25);
    border-radius:50%;
    right:-50px;
    top:-50px;
}

.circle3{
    position:absolute;
    width:180px;
    height:180px;
    background:rgba(255,255,255,0.2);
    border-radius:50%;
    bottom:-50px;
    left:45%;
}

/* Content */

.content{

    position:relative;

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}

h1{

    margin:0;

    color:#0f172a;

    font-size:40px;

    letter-spacing:3px;

    text-shadow:2px 2px 4px rgba(0,0,0,0.15);

}

p{

    margin-top:10px;

    color:#1e293b;

    font-size:18px;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="circle1"></div>
<div class="circle2"></div>
<div class="circle3"></div>

<div class="content">

<h1>KUPENDRA JANE</h1>

<p>
Computer Science Engineering Student
</p>

<p>
Personal Portfolio Website
</p>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technical Skills</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
}

h1{
    text-align:center;
    color:#fff;
    font-size:40px;
    text-shadow:2px 2px 5px black;
}

.skill-box{

    width:85%;

    margin:25px auto;

    padding:20px;

    border-radius:20px;

    color:white;

    box-shadow:0px 8px 20px rgba(0,0,0,0.3);

    transition:0.4s;

}

.skill-box:hover{

    transform:scale(1.03);

}

.languages{
    background:linear-gradient(45deg,#ff512f,#dd2476);
}

.database{
    background:linear-gradient(45deg,#11998e,#38ef7d);
}

.tools{
    background:linear-gradient(45deg,#396afc,#2948ff);
}

.cs{
    background:linear-gradient(45deg,#f7971e,#ffd200);
    color:black;
}

.skill-box h2{
    text-align:center;
    font-size:28px;
}

.skill-box ul{
    list-style:none;
    padding:0;
}

.skill-box li{

    background:rgba(255,255,255,0.25);

    margin:10px;

    padding:12px;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

}

</style>
</head>

<body>

<h1>🚀 TECHNICAL SKILLS 🚀</h1>

<div class="skill-box languages">

<h2>💻 Languages</h2>

<ul>
<li>C</li>
<li>Python</li>
<li>Java</li>
<li>SQL</li>
</ul>

</div>

<div class="skill-box database">

<h2>🗄 Databases</h2>

<ul>
<li>MySQL</li>
<li>MongoDB</li>
</ul>

</div>

<div class="skill-box tools">

<h2>🛠 Tools</h2>

<ul>
<li>GitHub</li>
<li>VS Code</li>
</ul>

</div>

<div class="skill-box cs">

<h2>📚 CS Fundamentals</h2>

<ul>
<li>DSA</li>
<li>OOP</li>
<li>DBMS</li>
<li>Operating Systems</li>
<li>Computer Networks</li>
</ul>

</div>

</body>
</html>
